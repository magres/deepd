# deepd configuration (installed as /system/etc/deepd.conf).
# All values are simple integers / plain paths. Missing keys fall back
# to the built-in defaults used by deepd.sh.
#
# Seconds between daemon checks (framework state polls). Default 6.
grace=6

# Seconds after a wake during which a new suspend is skipped, so that
# button / remote wakes always reach live UI. Default 20.
cooldown=20

# If the box is awake while the TV has been giving no HDMI signal
# for this many seconds, put it back to sleep (air-mouse remotes wake
# the box when the TV power is toggled). NOTE: keep 0 by default —
# reliable "TV is off" detection turned out to be strongly TV-specific
# (HPD nodes and CEC message history both failed on some models).
# Only enable after verifying a working signal on your hardware.
# 0 disables the watchdog.
tv_off_grace=0

# Sysfs node to read the HDMI hot-plug state from (1 = TV connected
# and signaling, 0 = TV off / other input). Amlogic default below.
# An empty, unreadable or wrong path keeps the watchdog off.
hpd_state_path=/sys/class/amhdmitx/amhdmitx0/hpd_state

# 1 = log every watchdog poll with the HPD value (useful while tuning).
debug=0
